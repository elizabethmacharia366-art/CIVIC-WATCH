<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in / Register | CivicWatch</title>
  <style>
    :root { color-scheme: dark; --accent: #37df88; --ink: #07151b; --panel: #102832; --line: #31515d; --muted: #b5c8cc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #effaf7; background: radial-gradient(circle at top left, #1a5a55, var(--ink) 54%); }
    .login-card { width: min(100%, 460px); padding: clamp(26px, 5vw, 42px); border: 1px solid var(--line); border-radius: 20px; background: rgba(16, 40, 50, .96); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.4rem); color: var(--accent); font-weight: 700; }
    .intro { margin: 8px 0 20px; color: var(--muted); line-height: 1.5; font-size: .95rem; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 14px; background: transparent; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; transition: all .2s ease; text-align: center; }
    .tab-btn.active { background: rgba(55, 223, 136, 0.15); border-color: var(--accent); color: var(--accent); }

    label { display: block; margin: 14px 0 6px; color: #dceae6; font-weight: 600; font-size: .9rem; }
    input, select, button { width: 100%; min-height: 44px; border-radius: 9px; font: inherit; }
    input, select { padding: 0 14px; border: 1px solid var(--line); color: #effaf7; background: #0a1d25; transition: border-color .2s ease; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    
    .submit-btn { margin-top: 24px; cursor: pointer; border: 0; color: #062313; background: var(--accent); font-weight: 700; font-size: 1rem; transition: transform .15s ease, filter .15s ease; }
    .submit-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    
    .message { min-height: 22px; margin: 16px 0 0; color: #ff8e8e; font-size: .9rem; text-align: center; font-weight: 500; }
    .message.success { color: var(--accent); }

    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 44px; }
    .password-toggle { position: absolute; right: 8px; background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 6px; width: 34px; min-height: 34px; display: flex; align-items: center; justify-content: center; transition: color .2s ease, background .2s ease; border-radius: 6px; }
    .password-toggle:hover { color: var(--accent); background: rgba(55, 223, 136, 0.12); }
    .password-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

    .hint { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; line-height: 1.5; text-align: center; }
    .hint strong { color: #fff; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">CivicWatch Portal</p>
    
    <div class="tabs" role="tablist">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="setMode('login')">Sign In</button>
      <button type="button" class="tab-btn" id="tabRegister" onclick="setMode('register')">Create Account</button>
    </div>

    <h1 id="formTitle">Welcome back</h1>
    <p class="intro" id="formSubtitle">Sign in to access your civic dashboard.</p>
    
    <form id="authForm">
      <!-- Register only field -->
      <div id="nameGroup" class="hidden">
        <label for="name">Full Name</label>
        <input id="name" name="name" placeholder="e.g. Jane Doe" autocomplete="name">
      </div>

      <!-- Login only field -->
      <div id="roleGroup">
        <label for="role">Account Role</label>
        <select id="role" name="role">
          <option value="citizen">Citizen</option>
          <option value="department">Department Official</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <!-- Common fields -->
      <label for="username" id="usernameLabel">Username or Email</label>
      <input id="username" name="username" placeholder="Enter username or email" autocomplete="username" required>
      
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" tabindex="0">
          <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed hidden" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <!-- Register only confirm password -->
      <div id="confirmPasswordGroup" class="hidden">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Show password" tabindex="0">
            <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed hidden" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      <p class="message" id="message" role="alert"></p>
    </form>
    
    <p class="hint" id="footerHint"><strong>Administrator & Department accounts</strong> are provisioned by your system administrator. Citizens can register a free account.</p>
    <p class="hint"><a href="/">← Return to the public portal</a></p>
  </main>

  <script>
    function togglePasswordVisibility(inputId, toggleBtn) {
      const input = document.getElementById(inputId);
      const eyeOpen = toggleBtn.querySelector('.eye-open');
      const eyeClosed = toggleBtn.querySelector('.eye-closed');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
        toggleBtn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
        toggleBtn.setAttribute('aria-label', 'Show password');
      }
    }

    const destinations = { admin: '/ADMIN.HTML/INDEX.HTML', department: '/DEPARTMENT.HTML/DASHBOARD.HTML', citizen: '/CITIZEN.HTML/DASHBOARD.HTML' };
    let currentMode = 'login';

    const urlParams = new URLSearchParams(location.search);
    const selectedRole = urlParams.get('role');
    const initialMode = urlParams.get('mode');

    if (selectedRole && destinations[selectedRole]) {
      document.getElementById('role').value = selectedRole;
    }

    function setMode(mode) {
      currentMode = mode;
      const message = document.getElementById('message');
      message.textContent = '';
      message.className = 'message';

      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const roleGroup = document.getElementById('roleGroup');
      const nameGroup = document.getElementById('nameGroup');
      const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'register') {
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
        formTitle.textContent = 'Create Citizen Account';
        formSubtitle.textContent = 'Register to report issues and track resolutions.';
        roleGroup.classList.add('hidden');
        nameGroup.classList.remove('hidden');
        confirmPasswordGroup.classList.remove('hidden');
        submitBtn.textContent = 'Register & Sign In';
        document.getElementById('usernameLabel').textContent = 'Username or Email';
      } else {
        tabRegister.classList.remove('active');
        tabLogin.classList.add('active');
        formTitle.textContent = 'Welcome back';
        formSubtitle.textContent = 'Sign in to access your civic dashboard.';
        roleGroup.classList.remove('hidden');
        nameGroup.classList.add('hidden');
        confirmPasswordGroup.classList.add('hidden');
        submitBtn.textContent = 'Sign in';
        document.getElementById('usernameLabel').textContent = 'Username or Email';
      }
    }

    if (initialMode === 'register') {
      setMode('register');
    }

    document.getElementById('authForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('message');
      message.textContent = '';
      message.className = 'message';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      if (currentMode === 'register') {
        const name = document.getElementById('name').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!username || !password) {
          message.textContent = 'Please provide both username and password.';
          return;
        }
        if (confirmPassword && password !== confirmPassword) {
          message.textContent = 'Passwords do not match.';
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';
          
          const response = await fetch('/api/citizens/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, name: name || username, email: username })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Unable to create account');

          message.className = 'message success';
          message.textContent = 'Account created! Redirecting...';
          
          localStorage.setItem('authToken', result.token);
          localStorage.setItem('currentUser', JSON.stringify(result.user));
          setTimeout(() => location.assign(destinations.citizen), 600);
        } catch (error) {
          message.textContent = error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register & Sign In';
        }
      } else {
        const role = document.getElementById('role').value;
        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';

          const response = await fetch(`/api/${role === 'citizen' ? 'citizens' : role}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Unable to sign in');
          if (result.user.role !== role) throw new Error(`This account is not a ${role} account.`);

          message.className = 'message success';
          message.textContent = 'Sign in successful! Redirecting...';

          localStorage.setItem('authToken', result.token);
          localStorage.setItem('currentUser', JSON.stringify(result.user));
          setTimeout(() => location.assign(destinations[role]), 400);
        } catch (error) {
          message.textContent = error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      }
    });
  </script>
</body>
</html>
