<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Department Profile | CivicWatch</title>
<style>header{display:flex;justify-content:space-between;align-items:center}main{max-width:720px}.profile-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.profile-meta div{padding:13px;border:1px solid #2c5360;border-radius:9px}.profile-meta strong{display:block;color:#38df8a}form{margin-top:22px;display:grid;gap:12px}.profile-message{min-height:24px}</style></head>
<body data-role="department"><header><h1>Department Profile</h1><a href="DASHBOARD.HTML">Dashboard</a></header><main><section><h2>Your account</h2><div class="profile-meta"><div><strong>Role</strong><span id="profileRole"></span></div><div><strong>Username</strong><span id="profileUsername"></span></div></div><form id="profileForm"><label>Display name<input name="name" required></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone" type="tel"></label><button type="submit">Save profile</button><p id="profileMessage" class="profile-message" aria-live="polite"></p></form></section></main><script src="../../.JS/profile.js"></script></body></html>
