<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen Communication | CivicWatch</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111B21;
      color: #FFFFFF;
    }

    header {
      background-color: #25D366;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #111B21;
    }

    nav {
      background-color: #1A1A1A;
      padding: 15px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: #25D366;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    section {
      background-color: #1F2C34;
      padding: 25px;
      border-radius: 8px;
    }

    section h2 {
      color: #25D366;
      margin-top: 0;
    }

    .report-card {
      background-color: #263238;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .report-header h3 {
      margin: 0;
      font-size: 1.1em;
      color: #25D366;
    }

    .citizen-message {
      font-size: 0.95em;
      color: #CCCCCC;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: none;
      background-color: #37474F;
      color: #FFFFFF;
      font-size: 0.9em;
      margin-top: 5px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-buttons button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .update {
      background-color: #25D366;
      color: #111B21;
    }

    .request {
      background-color: #FFA726;
      color: #111B21;
    }

    .respond {
      background-color: #42A5F5;
      color: #FFFFFF;
    }
    .back-button {
      Display: inline-block;
      Margin-top: 30px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border-radius: 6px;
      Text-decoration: none;
      Font-weight: bold;
      Box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Citizen Communication</h1>
  </header>

  <main>
    <section>
      <h2>Engage with Citizens</h2>

      <div class="report-card" data-report-id="RPT-1023">
        <div class="report-header">
          <h3>Report #RPT-1023</h3>
          <span class="priority-tag">High Priority</span>
        </div>
        <div class="citizen-message" data-citizen-message>
          "The pothole is getting worse. Can someone come this week?"
        </div>
        <textarea placeholder="Type your response or request..." data-response-input></textarea>
        <div class="action-buttons">
          <button class="update" data-action="send-update" data-report-id="RPT-1023">Send Update</button>
          <button class="request" data-action="request-info" data-report-id="RPT-1023">Request Info</button>
          <button class="respond" data-action="respond-comment" data-report-id="RPT-1023">Respond</button>
        </div>
      </div>

      <div class="report-card" data-report-id="RPT-1017">
        <div class="report-header">
          <h3>Report #RPT-1017</h3>
          <span class="priority-tag">Medium Priority</span>
        </div>
        <div class="citizen-message" data-citizen-message>
          "Do you need a clearer photo of the faded crossing?"
        </div>
        <textarea placeholder="Type your response or request..." data-response-input></textarea>
        <div class="action-buttons">
          <button class="update" data-action="send-update" data-report-id="RPT-1017">Send Update</button>
          <button class="request" data-action="request-info" data-report-id="RPT-1017">Request Info</button>
          <button class="respond" data-action="respond-comment" data-report-id="RPT-1017">Respond</button>
        </div>
      </div>

    </section>
  </main>
 <div style="text-align: center;">
        <a href="DASHBOARD.html#DASHBOARD" class="back-button">← Back to Dashboard</a>
      </div>
</body>
</html>
