<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map & Location View | CivicWatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #111B21; color: #FFFFFF; }
    header { background-color: #25D366; padding: 20px; text-align: center; }
    header h1 { margin: 0; color: #111B21; }
    nav { background-color: #1A1A1A; padding: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
    nav a { color: #25D366; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { padding: 30px; max-width: 1100px; margin: auto; }
    section { background-color: #1F2C34; padding: 25px; border-radius: 8px; }
    section h2 { color: #25D366; margin-top: 0; }
    .filters { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .filters label { font-weight: bold; color: #25D366; }
    .filters select { padding: 8px; border-radius: 4px; border: none; background-color: #37474F; color: #FFFFFF; }
    #map { height: 500px; width: 100%; border-radius: 6px; margin-top: 10px; }
      .back-button {
      Display: inline-block;
      Margin-top: 30px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border-radius: 6px;
      Text-decoration: none;
      Font-weight: bold;
      Box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
      <h1 data-i18n="department_map_title">Department Map & Location View</h1>
      <div>
        <label for="langSelector" style="margin-right:8px;color:#ccc;" data-i18n="ui_language">Language</label>
        <select id="langSelector">
          <option value="en">English</option>
          <option value="sw">Kiswahili</option>
          <option value="lg">Local</option>
        </select>
        <label for="uiTheme" style="margin:0 8px;color:#ccc;" data-i18n="ui_theme_label">Theme</label>
        <select id="uiTheme">
          <option value="dark" data-i18n="dark_theme">Dark</option>
          <option value="light" data-i18n="light_theme">Light</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section>
      <h2>Reported Issues Map</h2>

      <div class="filters">
        <div>
          <label for="filter-area" data-i18n="area">Area</label><br>
          <select id="filter-area" data-filter="area">
            <option value="all">All</option>
            <option value="CBD">CBD</option>
            <option value="Umoja">Umoja</option>
            <option value="Westlands">Westlands</option>
          </select>
        </div>
        <div>
          <label for="filter-status" data-i18n="status">Status</label><br>
          <select id="filter-status" data-filter="status">
            <option value="all">All</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <div>
          <label for="filter-priority" data-i18n="priority">Priority</label><br>
          <select id="filter-priority" data-filter="priority">
            <option value="all">All</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>

      <div id="map"></div>
    </section>
  </main>
<div style="text-align: center;">
        <a href="DASHBOARD.HTML#DASHBOARD" class="back-button">← Back to Dashboard</a>
      </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../.JS/i18n.js"></script>
  <script>
    const map = L.map('map');
    const kenyaBounds = [[-4.7,33.5],[5.0,41.9]]; 
    map.fitBounds(kenyaBounds);
    map.setMaxBounds(kenyaBounds);
    map.options.maxBoundsViscosity = 1;
    map.setMinZoom(6);
    map.setMaxZoom(15);
    L.rectangle(kenyaBounds, { color: '#FFD54F', weight: 2, fill: false, dashArray: '6 4' }).addTo(map);
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' });
    const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { attribution: '&copy; CartoDB, OpenStreetMap contributors' });
    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', { attribution: '&copy; CartoDB, OpenStreetMap contributors' });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics' });
    satelliteLayer.addTo(map);
    const baseLayers = { 'Light': lightLayer, 'Dark': darkLayer, 'Street': streetLayer, 'Satellite': satelliteLayer };
    L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    let userMarker = null;

    function clampLatLng(latlng) {
      const b = L.latLngBounds(kenyaBounds);
      const lat = Math.max(b.getSouth(), Math.min(b.getNorth(), latlng.lat));
      const lng = Math.max(b.getWest(), Math.min(b.getEast(), latlng.lng));
      return L.latLng(lat, lng);
    }

    function placeUserMarker(latlng, label='Your location') {
      const clamped = clampLatLng(latlng);
      if (userMarker) userMarker.remove();
      userMarker = L.marker(clamped, { draggable: true }).addTo(map).bindPopup(`${label}<br>${clamped.lat.toFixed(6)}, ${clamped.lng.toFixed(6)}`).openPopup();
      if (Math.abs(clamped.lat - latlng.lat) > 1e-6 || Math.abs(clamped.lng - latlng.lng) > 1e-6) {
        alert('Selected location was outside Kenya and was snapped to the nearest point inside Kenya.');
      }
      userMarker.on('dragend', (e) => {
        const newLatLng = e.target.getLatLng();
        const clampedNew = clampLatLng(newLatLng);
        if (Math.abs(clampedNew.lat - newLatLng.lat) > 1e-6 || Math.abs(clampedNew.lng - newLatLng.lng) > 1e-6) {
          userMarker.setLatLng(clampedNew);
          userMarker.bindPopup(`<strong>Snapped:</strong><br>${clampedNew.lat.toFixed(6)}, ${clampedNew.lng.toFixed(6)}`).openPopup();
        } else {
          userMarker.openPopup();
        }
      });
    }

    map.on('click', (e) => {
      placeUserMarker(e.latlng, 'Selected location');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const controls = document.createElement('div');
      controls.style.margin = '8px 0';
      const btnMark = document.createElement('button'); btnMark.id = 'markMe'; btnMark.setAttribute('data-i18n','mark_location');
      const small = document.createElement('small'); small.style.color = '#ccc'; small.style.marginLeft = '8px'; small.textContent = '(click map to pick manually)';
      controls.appendChild(btnMark); controls.appendChild(small);
      document.querySelector('main section').insertBefore(controls, document.getElementById('map'));
      document.getElementById('markMe').addEventListener('click', () => {
        if (!navigator.geolocation) return alert('Geolocation not supported');
        navigator.geolocation.getCurrentPosition((pos) => {
          const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const clamped = clampLatLng(ll);
          map.setView(clamped, 13);
          placeUserMarker(clamped, 'My location');
        }, (err) => alert('Unable to get location: ' + err.message));
      });

      const saveBtn = document.createElement('button'); saveBtn.id = 'saveLocation'; saveBtn.setAttribute('data-i18n','save_location'); saveBtn.style.marginLeft = '8px';
      document.querySelector('main section .filters').appendChild(saveBtn);
      saveBtn.addEventListener('click', async () => {
        if (!userMarker) return alert('No marker to save. Click the map or use "Mark My Location".');
        const ll = userMarker.getLatLng();
        try {
          const res = await fetch('http://localhost:3000/api/locations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ latitude: ll.lat, longitude: ll.lng, source: 'department_map' }) });
          if (!res.ok) throw new Error('Save failed');
          alert('Location saved successfully');
        } catch (e) { alert('Failed to save location: ' + e.message); }
      });

      document.getElementById('filter-status').addEventListener('change', (e) => {
        loadReports({ status: e.target.value, priority: document.getElementById('filter-priority').value });
      });
      document.getElementById('filter-priority').addEventListener('change', (e) => {
        loadReports({ status: document.getElementById('filter-status').value, priority: e.target.value });
      });

      function applyUITheme(theme) {
        document.body.classList.toggle('theme-light', theme === 'light');
        document.body.classList.toggle('theme-dark', theme !== 'light');
        localStorage.setItem('cw_theme', theme);
        if (theme === 'light') { if (!map.hasLayer(lightLayer)) map.addLayer(lightLayer); if (map.hasLayer(darkLayer)) map.removeLayer(darkLayer); }
        else { if (!map.hasLayer(darkLayer)) map.addLayer(darkLayer); if (map.hasLayer(lightLayer)) map.removeLayer(lightLayer); }
      }
      const themeSel = document.getElementById('uiTheme');
      const savedTheme = localStorage.getItem('cw_theme') || 'dark';
      themeSel.value = savedTheme;
      applyUITheme(savedTheme);
      themeSel.addEventListener('change', (e) => applyUITheme(e.target.value));
    });

    async function loadReports(filters = {}) {
      markersLayer.clearLayers();
      try {
        const res = await fetch('http://localhost:3000/api/reports');
        if (!res.ok) throw new Error('Failed to fetch reports');
        const data = await res.json();
          data.forEach(r => {
            const status = (r.status || r.Status || '').toString();
            const priority = r.priority || r.Priority || 'Low';
            if (filters.status && filters.status !== 'all' && status.toLowerCase() !== filters.status.toLowerCase()) return;
            if (filters.priority && filters.priority !== 'all' && priority !== filters.priority) return;
            const lat = r.lat || (r.location && r.location.lat) || r.latitude;
            const lng = r.lng || (r.location && r.location.lng) || r.longitude;
            if (!lat || !lng) return;
            const boundsCheck = L.latLngBounds(kenyaBounds);
            if (!boundsCheck.contains([lat, lng])) return;
            const s = status.toLowerCase();
            let color = '#2196f3';
            if (s.includes('resolved')) color = '#4caf50';
            else if (s.includes('in progress') || s.includes('progress')) color = '#ff9800';
            else if (s.includes('pending')) color = '#fdd835';
            else if (s.includes('unsolved') || s.includes('open')) color = '#f44336';
            const marker = L.circleMarker([lat, lng], { radius: 7, color, fillColor: color, fillOpacity: 0.9 });
            marker.bindPopup(`<strong>${r.title || r.name || 'Report'}</strong><br>Status: ${status || 'Unknown'}<br>Priority: ${priority}`);
            markersLayer.addLayer(marker);
          });
      } catch (e) { console.error('loadReports error', e); }
    }

    loadReports();
  </script>
</body>
</html>
