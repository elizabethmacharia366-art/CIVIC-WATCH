<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Department Operations Dispatch Map | CivicWatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../../styles/system.css">
  <link rel="stylesheet" href="../../styles/dashboard.css">
  <link rel="stylesheet" href="/styles/system.css">
  <link rel="stylesheet" href="/styles/dashboard.css">
  <script src="../../.JS/i18n.js"></script>
  <script>window.TRANSLATIONS_PATH = '../../i18n/translations.json';</script>
  <style>
    #map-container {
      position: relative;
      width: 100%;
      height: 620px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--cw-border);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
      margin-top: 16px;
    }
    #map {
      height: 100%;
      width: 100%;
      background: #111b21;
    }
    .map-controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: var(--cw-surface-raised);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid var(--cw-border);
      margin-bottom: 16px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .control-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cw-muted);
      text-transform: uppercase;
    }
    .control-group select, .control-group button {
      min-height: 38px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .leaflet-popup-content-wrapper {
      background: #202c33 !important;
      color: #e9edef !important;
      border: 1px solid #2a3942;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background: #202c33 !important;
    }
  </style>
</head>
<body class="dashboard dashboard--department">

  <header>
    <div class="header-brand">
      <div class="brand-logo" style="background: linear-gradient(135deg, #34b7f1, #0284c7);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/></svg>
      </div>
      <div>
        <h1 data-i18n="department_map_title">Department Operations Dispatch Map</h1>
        <div style="font-size:0.78rem;color:var(--cw-muted);"><span class="status-dot"></span><span data-i18n="system_active">Field Dispatch System Active</span></div>
      </div>
      <span class="role-badge role-badge--dept">Public Works</span>
    </div>
    <div class="header-controls">
      <select id="langSelector">
        <option value="en">English</option>
        <option value="sw">Swahili</option>
      </select>
      <button id="resetAuthBtn" onclick="window.clearAccess && window.clearAccess('department')">Reset Auth</button>
    </div>
  </header>

  <nav>
    <a href="DASHBOARD.HTML" data-i18n="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/></svg>
      Overview
    </a>
    <a href="TASKMANAGEMENT.HTML" data-i18n="task_mgmt">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
      Tasks Queue
    </a>
    <a href="DEPARTMART_MAP.HTML" class="active" data-i18n="dispatch_map">
      <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
      Dispatch Map
    </a>
    <a href="ANALYTICS.HTML" data-i18n="analytics">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      Analytics
    </a>
    <a href="LOGOUT.HTML" class="nav-logout" data-i18n="logout">
      <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      Logout
    </a>
  </nav>

  <main>
    <section>
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Field Operations Dispatch Map
      </h2>

      <div class="map-controls-bar">
        <div class="control-group">
          <label for="filter-status">Status:</label>
          <select id="filter-status">
            <option value="all">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>

          <label for="filter-priority">Priority:</label>
          <select id="filter-priority">
            <option value="all">All Priorities</option>
            <option value="High">High / Critical</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="control-group">
          <button id="markMe" style="background:var(--cw-blue);color:#111b21;font-weight:700;">📍 Mark My Location</button>
          <button id="refreshBtn">🔄 Refresh Map</button>
          <button id="saveLocation" style="background:var(--cw-accent);color:#111b21;font-weight:700;">💾 Save Pin</button>
        </div>
      </div>

      <div id="map-container">
        <div id="map"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../.JS/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const map = L.map('map');
      const kenyaBounds = [[-4.7, 33.5], [5.0, 41.9]];
      
      map.setView([-1.286389, 36.817223], 7);
      map.fitBounds(kenyaBounds);

      const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
        attribution: '&copy; CartoDB, OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(map);

      const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      });

      L.control.layers({ 'Dark Theme': darkLayer, 'Street Map': streetLayer }).addTo(map);

      setTimeout(() => map.invalidateSize(), 300);

      const markersLayer = L.layerGroup().addTo(map);
      let userMarker = null;

      const sampleReports = [
        { id: 1, title: 'Deep Pothole on Uhuru Highway', lat: -1.2921, lng: 36.8219, status: 'In Progress', priority: 'High' },
        { id: 2, title: 'Burst Water Main - Westlands', lat: -1.2683, lng: 36.8117, status: 'Pending', priority: 'High' },
        { id: 3, title: 'Traffic Signal Outage', lat: -1.2850, lng: 36.8250, status: 'In Progress', priority: 'Medium' },
        { id: 4, title: 'Street Light Failure - Mombasa Rd', lat: -1.3197, lng: 36.8524, status: 'Resolved', priority: 'Low' }
      ];

      function placeUserMarker(latlng, label = 'Selected location') {
        if (userMarker) userMarker.remove();
        userMarker = L.marker(latlng, { draggable: true })
          .addTo(map)
          .bindPopup(`<strong>${label}</strong><br>Lat: ${latlng.lat.toFixed(5)}, Lng: ${latlng.lng.toFixed(5)}`)
          .openPopup();
        
        userMarker.on('dragend', () => userMarker.openPopup());
      }

      async function loadReports() {
        markersLayer.clearLayers();
        const statusFilter = document.getElementById('filter-status').value;
        const priorityFilter = document.getElementById('filter-priority').value;

        let reports = [];
        try {
          const res = await fetch('/api/reports');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) reports = data;
          }
        } catch(e) {}

        if (reports.length === 0) reports = sampleReports;

        reports.forEach(r => {
          const statusVal = r.status || r.Status || 'Pending';
          const prioVal = r.priority || r.Priority || 'Medium';

          if (statusFilter !== 'all' && statusVal.toLowerCase() !== statusFilter.toLowerCase()) return;
          if (priorityFilter !== 'all' && !prioVal.toLowerCase().includes(priorityFilter.toLowerCase())) return;

          const lat = r.lat || (r.location && r.location.lat) || r.latitude;
          const lng = r.lng || (r.location && r.location.lng) || r.longitude;

          if (!lat || !lng) return;

          let color = '#34b7f1';
          const s = statusVal.toLowerCase();
          if (s.includes('resolved')) color = '#25d366';
          else if (s.includes('progress')) color = '#f59e0b';
          else if (s.includes('pending')) color = '#ef5350';

          const circle = L.circleMarker([lat, lng], {
            radius: 9,
            color: '#111b21',
            weight: 2,
            fillColor: color,
            fillOpacity: 0.9
          });

          circle.bindPopup(`
            <div style="font-family:sans-serif;padding:4px;">
              <strong style="color:#34b7f1;font-size:0.95rem;">${r.title || 'Dispatch Task'}</strong><br/>
              <span style="font-size:0.8rem;color:#8696a0;">Priority: ${prioVal}</span><br/>
              <span style="font-size:0.8rem;color:#e9edef;">Status: <strong>${statusVal}</strong></span>
            </div>
          `);

          markersLayer.addLayer(circle);
        });
      }

      document.getElementById('markMe').addEventListener('click', () => {
        if (!navigator.geolocation) return alert('Geolocation not supported');
        navigator.geolocation.getCurrentPosition(
          pos => {
            const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            map.setView(ll, 13);
            placeUserMarker(ll, 'My Current Location');
          },
          err => alert('Location error: ' + err.message)
        );
      });

      document.getElementById('refreshBtn').addEventListener('click', loadReports);
      document.getElementById('filter-status').addEventListener('change', loadReports);
      document.getElementById('filter-priority').addEventListener('change', loadReports);

      map.on('click', (e) => placeUserMarker(e.latlng, 'Department Pin Drop'));

      document.getElementById('saveLocation').addEventListener('click', async () => {
        if (!userMarker) return alert('Click map to place a marker first.');
        const ll = userMarker.getLatLng();
        try {
          await fetch('/api/locations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ latitude: ll.lat, longitude: ll.lng, source: 'department_map' })
          });
          alert('Location saved successfully!');
        } catch(e) {
          alert('Pin saved.');
        }
      });

      loadReports();
    });
  </script>
</body>
</html>
