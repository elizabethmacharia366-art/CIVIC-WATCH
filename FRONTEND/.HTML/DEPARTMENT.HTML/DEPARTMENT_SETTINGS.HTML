<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Department Settings | CivicWatch</title>
  <style>
    Body {
      Margin: 0;
      Font-family: ‘Segoe UI’, sans-serif;
      Background-color: #111B21;
      Color: #FFFFFF;
    }

    Header {
      Background-color: #25D366;
      Padding: 20px;
      Text-align: center;
    }

    Header h1 {
      Margin: 0;
      Color: #111B21;
    }

    Nav {
      Background-color: #1A1A1A;
      Padding: 15px;
      Display: flex;
      Justify-content: center;
      Flex-wrap: wrap;
      Gap: 20px;
    }

    Nav a {
      Color: #25D366;
      Text-decoration: none;
      Font-weight: bold;
    }

    Nav a:hover {
      Text-decoration: underline;
    }

    Main {
      Padding: 30px;
      Max-width: 1000px;
      Margin: auto;
    }

    Section {
      Background-color: #1F2C34;
      Padding: 25px;
      Border-radius: 8px;
      Margin-bottom: 30px;
    }

    Section h2 {
      Color: #25D366;
      Margin-top: 0;
    }

    Label {
      Display: block;
      Margin-top: 15px;
      Font-weight: bold;
      Color: #25D366;
    }

    Input, select {
      Width: 100%;
      Padding: 10px;
      Margin-top: 5px;
      Border: none;
      Border-radius: 4px;
      Background-color: #263238;
      Color: #FFFFFF;
    }

    Button {
      Margin-top: 20px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border: none;
      Border-radius: 4px;
      Font-weight: bold;
      Cursor: pointer;
    }

    Button:hover {
      Background-color: #1EB980;
    }

    .staff-list {
      Margin-top: 15px;
    }

    .staff-list li {
      Background-color: #263238;
      Padding: 10px;
      Border-radius: 4px;
      Margin-bottom: 8px;
      Display: flex;
      Justify-content: space-between;
      Align-items: center;
    }

    .staff-list button {
      Background-color: #FF5252;
      Color: #FFFFFF;
      Padding: 5px 10px;
      Border: none;
      Border-radius: 4px;
      Font-size: 0.9em;
      Cursor: pointer;
    }

    .staff-list button:hover {
      Background-color: #FF1744;
    }
    .back-button {
      Display: inline-block;
      Margin-top: 30px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border-radius: 6px;
      Text-decoration: none;
      Font-weight: bold;
      Box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Department Settings</h1>
  </header>
  <main>
    <section>
      <h2>Department Info</h2>
      <form>
        <label for="dept-name">Department Name</label>
        <input type="text" id="dept-name" value="Roads & Transport" data-setting="dept-name" />

        <label for="dept-contact">Contact Email</label>
        <input type="email" id="dept-contact" value=transport@civicwatch.go.ke data-setting="dept-contact" />

        <label for="working-hours">Working Hours</label>
        <input type="text" id="working-hours" value="Mon–Fri, 8:00 AM – 5:00 PM" data-setting="working-hours" />

        <button type="submit">Update Info</button>
      </form>
    </section>

    <section>
      <h2>Staff Accounts</h2>
      <ul class="staff-list" data-staff-list>
        <li>
          Officer A. Otieno
          <button data-remove="A. Otieno">Remove</button>
        </li>
        <li>
          Officer M. Wanjiku
          <button data-remove="M. Wanjiku">Remove</button>
        </li>
      </ul>

      <label for="new-staff">Add New Staff</label>
      <input type="text" id="new-staff" placeholder="Full name" data-add-staff />
      <button type="button">Add Staff</button>
    </section>

    <section>
      <h2>Notification Preferences</h2>
      <form>
        <label for="notify-updates">Receive Report Updates</label>
        <select id="notify-updates" data-setting="notify-updates">
          <option value="enabled" selected>Enabled</option>
          <option value="disabled">Disabled</option>
        </select>

        <label for="notify-comments">Citizen Comments & Replies</label>
        <select id="notify-comments" data-setting="notify-comments">
          <option value="enabled">Enabled</option>
          <option value="disabled" selected>Disabled</option>
        </select>

        <button type="submit">Save Preferences</button>
      </form>
    </section>
  </main>
 <div style="text-align: center;">
        <a href="DASHBOARD.HTML#DASHBOARD" class="back-button">← Back to Dashboard</a>
      </div>

</body>
</html>
