<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evidence & Attachments | CivicWatch</title>
  <style>
    Body {
      Margin: 0;
      Font-family: ‘Segoe UI’, sans-serif;
      Background-color: #111B21;
      Color: #FFFFFF;
    }

    Header {
      Background-color: #25D366;
      Padding: 20px;
      Text-align: center;
    }

    Header h1 {
      Margin: 0;
      Color: #111B21;
    }

    Nav {
      Background-color: #1A1A1A;
      Padding: 15px;
      Display: flex;
      Justify-content: center;
      Flex-wrap: wrap;
      Gap: 20px;
    }

    Nav a {
      Color: #25D366;
      Text-decoration: none;
      Font-weight: bold;
    }

    Nav a:hover {
      Text-decoration: underline;
    }

    Main {
      Padding: 30px;
      Max-width: 1000px;
      Margin: auto;
    }

    Section {
      Background-color: #1F2C34;
      Padding: 25px;
      Border-radius: 8px;
      Margin-bottom: 30px;
    }

    Section h2 {
      Color: #25D366;
      Margin-top: 0;
    }

    .report-block {
      Background-color: #263238;
      Padding: 20px;
      Border-radius: 6px;
      Margin-bottom: 20px;
    }

    .report-block h3 {
      Margin: 0 0 10px;
      Color: #25D366;
    }

    .media-preview {
      Display: flex;
      Flex-wrap: wrap;
      Gap: 15px;
      Margin-top: 10px;
    }

    .media-preview img,
    .media-preview video {
      Max-width: 200px;
      Border-radius: 4px;
      Border: 1px solid #444;
    }

    Label {
      Display: block;
      Margin-top: 15px;
      Font-weight: bold;
      Color: #25D366;
    }

    Input[type="file"] {
      Margin-top: 5px;
      Background-color: #37474F;
      Color: #FFFFFF;
      Padding: 8px;
      Border-radius: 4px;
      Border: none;
    }

    .upload-group {
      Margin-top: 15px;
    }.back-button {
      Display: inline-block;
      Margin-top: 30px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border-radius: 6px;
      Text-decoration: none;
      Font-weight: bold;
      Box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Evidence & Attachments</h1>
  </header>

  <main>
    <section>
      <h2>Manage Report Evidence</h2>

      <div class="report-block" data-report-id="RPT-1023">
        <h3>Report #RPT-1023 – Pothole on Juja Road</h3>

        <label>Citizen Attachments:</label>
        <div class="media-preview" data-citizen-media>
          <img src="uploads/pothole_before.jpg" alt="Before photo" />
          <video src="uploads/pothole_clip.mp4" controls></video>
        </div>

        <div class="upload-group">
          <label for="before-photo-RPT-1023">Upload Before Photo</label>
          <input type="file" id="before-photo-RPT-1023" data-upload="before" accept="image/*" />

          <label for="after-photo-RPT-1023">Upload After Photo</label>
          <input type="file" id="after-photo-RPT-1023" data-upload="after" accept="image/*" />

          <label for="official-doc-RPT-1023">Attach Official Document</label>
          <input type="file" id="official-doc-RPT-1023" data-upload="document" accept=".pdf,.doc,.docx" />
        </div>
      </div>

      <div class="report-block" data-report-id="RPT-1017">
        <h3>Report #RPT-1017 – Faded Zebra Crossing</h3>

        <label>Citizen Attachments:</label>
        <div class="media-preview" data-citizen-media>
          <img src="uploads/zebra_crossing.jpg" alt="Zebra crossing" />
        </div>

        <div class="upload-group">
          <label for="before-photo-RPT-1017">Upload Before Photo</label>
          <input type="file" id="before-photo-RPT-1017" data-upload="before" accept="image/*" />

          <label for="after-photo-RPT-1017">Upload After Photo</label>
          <input type="file" id="after-photo-RPT-1017" data-upload="after" accept="image/*" />

          <label for="official-doc-RPT-1017">Attach Official Document</label>
          <input type="file" id="official-doc-RPT-1017" data-upload="document" accept=".pdf,.doc,.docx" />
        </div>
      </div>

    </section>
  </main>
<div style="text-align: center;">
        <a href="DASHBOARD.HTML#DASHBOARD" class="back-button">← Back to Dashboard</a>
      </div>
</body>
</html>
