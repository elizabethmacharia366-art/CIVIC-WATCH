<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard | CivicWatch</title>
  <link rel="stylesheet" href="/styles/dashboard.css">
  <link rel="stylesheet" href="/styles/system.css">
  <script src="../../.JS/i18n.js"></script>
  <script>window.TRANSLATIONS_PATH = '../../i18n/translations.json';</script>
</head>
<body class="dashboard dashboard--admin">

  <header>
    <h1 data-i18n="admin_dashboard">Admin Dashboard</h1>
    <div style="display:flex;gap:12px;align-items:center;">
      <select id="langSelector" style="padding: 8px 12px; background: var(--cw-bg); color: var(--cw-text); border: 1px solid var(--cw-border); border-radius: 8px; cursor: pointer;">
        <option value="en">English</option>
        <option value="sw">Swahili</option>
      </select>
      <button id="resetAuthBtn" onclick="window.clearAccess && window.clearAccess('admin')" style="background: var(--cw-accent); color: #111b21; padding: 8px 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;">Reset Auth</button>
    </div>
  </header>

  <nav>
    <a href="ADMIN_MAP.HTML" data-i18n="adim_map">Admin Map</a>
    <a href="CONTENT MANAGEMENT.HTML" data-i18n="content_mgmt">Content Management</a>
    <a href="USERS MANAGEMENT.HTML" data-i18n="user_mgmt">User Management</a>
    <a href="SUBMISSION MANAGEMET.HTML" data-i18n="submission_mgmt">Submissions</a>
    <a href="NOTIFICATIONS.HTML" data-i18n="notifications">Notifications</a>
    <a href="ANALYTICS.HTML" data-i18n="analytics">Analytics</a>
    <a href="SETTING.HTML" data-i18n="admin_settings">Settings</a>
    <a href="PROFILE.HTML">My Profile</a>
    <a href="LOGOUT.HTML" style="color: #ef5350;" data-i18n="logout">Logout</a>
  </nav>

  <main>
    <section id="adminDashboard">
      <h2 data-i18n="dashboard">Overview</h2>
      <div class="metrics">
        <div class="metric">
          <h3 data-i18n="reports_submitted">Reports Submitted</h3>
          <p>1</p>
        </div>
        <div class="metric">
          <h3 data-i18n="users_registered">Users Registered</h3>
          <p>0</p>
        </div>
        <div class="metric">
          <h3 data-i18n="pending_feedback">Pending Feedback</h3>
          <p>0</p>
        </div>
        <div class="metric">
          <h3 data-i18n="most_active_region">Most Active Region</h3>
          <p>Nairobi Central</p>
        </div>
      </div>

      <div style="margin-top: 40px;">
        <h3 data-i18n="reports_by_region">Reports by Region</h3>
        <canvas id="regionChart" width="1000" height="300"></canvas>
      </div>

      <div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 30px;">
        <div style="flex: 1;">
          <h3 data-i18n="report_categories">Report Categories</h3>
          <canvas id="categoryChart" width="400" height="300"></canvas>
        </div>
        <div style="flex: 2;">
          <h3 data-i18n="monthly_submissions">Monthly Submissions</h3>
          <canvas id="monthlyChart" width="600" height="300"></canvas>
        </div>
      </div>

    </section>
  </main>

  <script src="../../.JS/ADMIN.JS"></script>
</body>
</html>
