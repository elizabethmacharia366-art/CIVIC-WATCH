<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logged Out | CivicWatch</title>
  <link rel="stylesheet" href="../../styles/system.css">
  <link rel="stylesheet" href="../../styles/dashboard.css">
  <link rel="stylesheet" href="/styles/dashboard.css">
</head>
<body class="dashboard" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--cw-bg);">

  <div style="background:var(--cw-surface);border:1px solid var(--cw-border);padding:40px;border-radius:16px;text-align:center;max-width:440px;width:90%;box-shadow:0 16px 32px rgba(0,0,0,0.4);">
    <div style="width:56px;height:56px;border-radius:14px;background:rgba(168,85,247,0.15);color:var(--cw-purple);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h1 style="color:var(--cw-purple);margin:0 0 10px 0;font-size:1.6rem;font-weight:800;">Admin Logged Out</h1>
    <p style="color:var(--cw-muted);margin-bottom:24px;font-size:0.95rem;">Administrative session safely terminated.</p>
    <a href="/login.html?role=admin" style="display:inline-block;background:var(--cw-accent);color:#111b21;padding:12px 24px;border-radius:8px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(37,211,102,0.25);">Return to Login</a>
  </div>

  <script>
    (async function() {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (e) {}
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      document.cookie = 'cw_session=; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT;';
    })();
  </script>
</body>
</html>
