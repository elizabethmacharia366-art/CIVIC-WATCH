<!DOCTYPE html>
<html lang=”en”>
<head>
  <meta charset=”UTF-8” />
  <meta name=”viewport” content=”width=device-width, initial-scale=1.0”/>
  <title>CivicWatch Admin – Settings</title>
  <style>
    Body {
      Margin: 0;
      Font-family: ‘Segoe UI’, sans-serif;
      Background-color: #111B21;
      Color: #EDEDED;
    }

    Header {
      Background-color: #25D366;
      Padding: 20px;
      Text-align: center;
    }

    Header h1 {
      Margin: 0;
      Color: #111B21;
    }

    Main {
      Padding: 30px;
      Max-width: 800px;
      Margin: auto;
    }

    Section {
      Background-color: #1F2C34;
      Margin-bottom: 25px;
      Padding: 20px;
      Border-radius: 8px;
    }

    Section h2 {
      Color: #25D366;
      Margin-top: 0;
    }

    .form-group {
      Margin-bottom: 20px;
    }

    Label {
      Display: block;
      Margin-bottom: 8px;
      Font-weight: bold;
    }

    Input[type=”text”],
    Select {
      Width: 100%;
      Padding: 10px;
      Background-color: #263238;
      Color: #EDEDED;
      Border: 1px solid #37474F;
      Border-radius: 4px;
    }

    .category-list {
      Margin-top: 10px;
      Background-color: #263238;
      Padding: 10px;
      Border-radius: 4px;
    }

    .category-list span {
      Display: inline-block;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 6px 10px;
      Border-radius: 4px;
      Margin: 5px 5px 0 0;
      Font-weight: bold;
    }

    Button {
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border: none;
      Border-radius: 6px;
      Font-weight: bold;
      Cursor: pointer;
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    Button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }

    .back-button {
      Display: inline-block;
      Margin-top: 30px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border-radius: 6px;
      Text-decoration: none;
      Font-weight: bold;
      Box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>CivicWatch Admin Panel</h1>
  </header>

  <main>
    <section id=”settings”>
      <h2>Settings</h2>
      <p>Configure site identity, categories, privacy, and backup options.</p>

      <div class=”form-group”>
        <label for=”site-name”>Site Name:</label>
        <input type=”text” id=”site-name” placeholder=”CivicWatch”>
      </div>

      <div class=”form-group”>
        <label for=”contact-email”>Contact Email:</label>
        <input type=”text” id=”contact-email” placeholder=admin@civicwatch.org>
      </div>

      <div class=”form-group”>
        <label for=”logo-url”>Logo URL:</label>
        <input type=”text” id=”logo-url” placeholder=https://example.com/logo.png>
      </div>

      <div class=”form-group”>
        <label for=”categories”>Report Categories:</label>
        <input type=”text” id=”new-category” placeholder=”e.g. Water, Roads, Education”>
        <div class=”category-list”>
          <span>Water</span>
          <span>Roads</span>
          <span>Education</span>
          <!—Dynamically add/remove categories 
        </div>
      </div>

      <div class=”form-group”>
        <label for=”privacy”>Privacy Settings:</label>
        <select id=”privacy”>
          <option value=”public”>Public – Anyone can view reports</option>
          <option value=”private”>Private – Only registered users</option>
        </select>
      </div>

      <div class=”form-group”>
        <label for=”backup”>Backup Options:</label>
        <select id=”backup”>
          <option value=”daily”>Daily Backup</option>
          <option value=”weekly”>Weekly Backup</option>
          <option value=”manual”>Manual Only</option>
        </select>
      </div>

      <button type=”submit”>Save Settings</button>

      <div style="text-align: center;">
        <a href="INDEX.HTML" class="back-button" data-i18n="back_to_index">← Back to Main page</a>
      </div>
    </section>
  </main>

</body>
</html>
