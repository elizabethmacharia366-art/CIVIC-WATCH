<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings | CivicWatch</title>
  <style>
    Body {
      Margin: 0;
      Font-family: ‘Segoe UI’, sans-serif;
      Background-color: #111B21;
      Color: #FFFFFF;
    }

    Header {
      Background-color: #25D366;
      Padding: 20px;
      Text-align: center;
    }

    Header h1 {
      Margin: 0;
      Color: #111B21;
    }

    Nav {
      Background-color: #1A1A1A;
      Padding: 15px;
      Display: flex;
      Justify-content: center;
      Flex-wrap: wrap;
      Gap: 20px;
    }

    Nav a {
      Color: #25D366;
      Text-decoration: none;
      Font-weight: bold;
    }

    Nav a:hover {
      Text-decoration: underline;
    }

    Main {
      Padding: 30px;
      Max-width: 800px;
      Margin: auto;
    }

    Section {
      Background-color: #1F2C34;
      Padding: 25px;
      Border-radius: 8px;
      Margin-bottom: 30px;
    }

    Section h2 {
      Color: #25D366;
      Margin-top: 0;
    }

    Label {
      Display: block;
      Margin-top: 15px;
      Font-weight: bold;
      Color: #25D366;
    }

    Input, select {
      Width: 100%;
      Padding: 10px;
      Margin-top: 5px;
      Border: none;
      Border-radius: 4px;
      Background-color: #263238;
      Color: #FFFFFF;
    }

    Button {
      Margin-top: 20px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border: none;
      Border-radius: 4px;
      Font-weight: bold;
      Cursor: pointer;
    }

    Button:hover {
      Background-color: #1EB980;
    }
    .back-button {
      Display: inline-block;
      Margin-top: 30px;
      Background-color: #25D366;
      Color: #111B21;
      Padding: 10px 20px;
      Border-radius: 6px;
      Text-decoration: none;
      Font-weight: bold;
      Box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      Transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .back-button:hover {
      Background-color: #1DA851;
      Transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Account Settings</h1>
  </header>
  <main>
    <section>
      <h2>Profile Information</h2>
      <form action="update_profile.html" method="post">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" value="Jane Citizen" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" value=jane@example.com required />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="+254700000000" />

        <label for="ID">ID Number</label>
        <input type="tel" id="ID" name="ID" value="34000000" />

        <button type="submit">Update Profile</button>
      </form>
    </section>

    <section>
      <h2>Notification Preferences</h2>
      <form action="update_notifications.html" method="post">
        <label for="notifyReports">Report Status Updates</label>
        <select id="notifyReports" name="notifyReports">
          <option value="enabled" selected>Enabled</option>
          <option value="disabled">Disabled</option>
        </select>

        <label for="notifyNews">Civic News & Alerts</label>
        <select id="notifyNews" name="notifyNews">
          <option value="enabled">Enabled</option>
          <option value="disabled" selected>Disabled</option>
        </select>

        <button type="submit">Save Preferences</button>
      </form>
    </section>

    <section>
      <h2>Change Password</h2>
      <form action="change_password.html" method="post">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" required />

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" required />

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />

        <button type="submit">Update Password</button>
      </form>
    </section>
  </main>
  <div style="text-align: center;">
        <a href="DASHBOARD.HTML#DASHBOARD" class="back-button">← Back to Dashboard</a>
      </div>

</body>
</html>
