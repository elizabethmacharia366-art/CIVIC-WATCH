<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map View | CivicWatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    header { background-color: #25D366; padding: 20px; text-align: center; }
    header h1 { margin: 0; color: #111B21; }
    main { padding: 30px; max-width: 1000px; margin: auto; }
    section { background-color: #1F2C34; padding: 25px; border-radius: 8px; }
    section h2 { color: #25D366; margin-top: 0; }
    #map { height: 500px; width: 100%; border-radius: 6px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
      <h1 data-i18n="nearby_reported_issues">Nearby Reported Issues</h1>
      <div>
        <label for="langSelector" style="margin-right:8px;color:#ccc;" data-i18n="ui_language">Language</label>
        <select id="langSelector">
          <option value="en">English</option>
          <option value="sw">Kiswahili</option>
          <option value="lg">Local</option>
        </select>
        <label for="uiTheme" style="margin:0 8px;color:#ccc;" data-i18n="ui_theme_label">Theme</label>
        <select id="uiTheme">
          <option value="dark" data-i18n="dark_theme">Dark</option>
          <option value="light" data-i18n="light_theme">Light</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section>
      <h2 data-i18n="nearby_reported_issues">Nearby Reported Issues</h2>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../.JS/i18n.js"></script>
  <script>
    const map = L.map('map');
    const kenyaBounds = [[-4.7,33.5],[5.0,41.9]];
      map.fitBounds(kenyaBounds);
      map.setMaxBounds(kenyaBounds);
      map.options.maxBoundsViscosity = 1;
      map.setMinZoom(6);
      map.setMaxZoom(15);
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' });
    const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { attribution: '&copy; CartoDB, OpenStreetMap contributors' });
    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', { attribution: '&copy; CartoDB, OpenStreetMap contributors' });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics' });
      L.rectangle(kenyaBounds, { color: '#FFD54F', weight: 2, fill: false, dashArray: '6 4' }).addTo(map);
    satelliteLayer.addTo(map);
    const baseLayers = { 'Light': lightLayer, 'Dark': darkLayer, 'Street': streetLayer, 'Satellite': satelliteLayer };
    L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    let userMarker = null;
    function clampLatLng(latlng) { const b = L.latLngBounds(kenyaBounds); const lat = Math.max(b.getSouth(), Math.min(b.getNorth(), latlng.lat)); const lng = Math.max(b.getWest(), Math.min(b.getEast(), latlng.lng)); return L.latLng(lat, lng); }

    function placeUserMarker(latlng, label='Your location') {
      const clamped = clampLatLng(latlng);
      if (userMarker) userMarker.remove();
      userMarker = L.marker(clamped, { draggable: true }).addTo(map).bindPopup(`${label}<br>${clamped.lat.toFixed(6)}, ${clamped.lng.toFixed(6)}`).openPopup();
      if (Math.abs(clamped.lat - latlng.lat) > 1e-6 || Math.abs(clamped.lng - latlng.lng) > 1e-6) {
        alert('Selected location was outside Kenya and was snapped to the nearest point inside Kenya.');
      }
      userMarker.on('dragend', (e) => {
        const newLatLng = e.target.getLatLng();
        const clampedNew = clampLatLng(newLatLng);
        if (Math.abs(clampedNew.lat - newLatLng.lat) > 1e-6 || Math.abs(clampedNew.lng - newLatLng.lng) > 1e-6) {
          userMarker.setLatLng(clampedNew);
          userMarker.bindPopup(`<strong>Snapped:</strong><br>${clampedNew.lat.toFixed(6)}, ${clampedNew.lng.toFixed(6)}`).openPopup();
        } else { userMarker.openPopup(); }
      });
    }

    map.on('click', (e) => placeUserMarker(e.latlng, 'Selected location'));

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button'); btn.id = 'markMe'; btn.setAttribute('data-i18n','mark_location');
      btn.style.margin = '8px 0';
      document.querySelector('main section').insertBefore(btn, document.getElementById('map'));
      btn.addEventListener('click', () => {
        if (!navigator.geolocation) return alert('Geolocation not supported');
        navigator.geolocation.getCurrentPosition((pos) => {
          const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const clamped = clampLatLng(ll);
          map.setView(clamped, 13);
          placeUserMarker(clamped, 'My location');
        }, (err) => alert('Unable to get location: ' + err.message));
      });

      const saveBtn = document.createElement('button'); saveBtn.id = 'saveLocation'; saveBtn.setAttribute('data-i18n','save_location'); saveBtn.style.marginLeft = '8px';
      document.querySelector('main section').appendChild(saveBtn);
      saveBtn.addEventListener('click', async () => {
        if (!userMarker) return alert('No marker to save. Click the map or use "Mark My Location".');
        const ll = userMarker.getLatLng();
        try {
          const res = await fetch('http://localhost:3000/api/locations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ latitude: ll.lat, longitude: ll.lng, source: 'citizen_map' }) });
          if (!res.ok) throw new Error('Save failed');
          alert('Location saved successfully');
        } catch (e) { alert('Failed to save location: ' + e.message); }
      });

      function applyUITheme(theme) {
        document.body.classList.toggle('theme-light', theme === 'light');
        document.body.classList.toggle('theme-dark', theme !== 'light');
        localStorage.setItem('cw_theme', theme);
        if (theme === 'light') { if (!map.hasLayer(lightLayer)) map.addLayer(lightLayer); if (map.hasLayer(darkLayer)) map.removeLayer(darkLayer); }
        else { if (!map.hasLayer(darkLayer)) map.addLayer(darkLayer); if (map.hasLayer(lightLayer)) map.removeLayer(lightLayer); }
      }
      const themeSel = document.getElementById('uiTheme');
      const savedTheme = localStorage.getItem('cw_theme') || 'dark';
      themeSel.value = savedTheme;
      applyUITheme(savedTheme);
      themeSel.addEventListener('change', (e) => applyUITheme(e.target.value));
    });

    async function loadReports() {
      markersLayer.clearLayers();
      try {
        const res = await fetch('http://localhost:3000/api/reports');
        if (!res.ok) throw new Error('no api');
        const data = await res.json();
          data.forEach(r => {
            const status = (r.status || r.Status || '').toString();
            const lat = r.lat || (r.location && r.location.lat) || r.latitude;
            const lng = r.lng || (r.location && r.location.lng) || r.longitude;
            if (!lat || !lng) return;
            const boundsCheck = L.latLngBounds(kenyaBounds);
            if (!boundsCheck.contains([lat, lng])) return;
            const s = status.toLowerCase();
            let color = '#2196f3';
            if (s.includes('resolved')) color = '#4caf50';
            else if (s.includes('in progress') || s.includes('progress')) color = '#ff9800';
            else if (s.includes('pending')) color = '#fdd835';
            else if (s.includes('unsolved') || s.includes('open')) color = '#f44336';
            const marker = L.circleMarker([lat, lng], { radius: 7, color, fillColor: color, fillOpacity: 0.9 }).addTo(markersLayer);
            marker.bindPopup(`<strong>${r.title || r.name || 'Report'}</strong><br>Status: ${status || 'Unknown'}`);
        });
      } catch (e) {
        const examples = [
          { title: 'Blocked Drainage in Umoja', lat: -1.2785, lng: 36.8862, status: 'Resolved' },
          { title: 'Potholes on Juja Road', lat: -1.2540, lng: 36.8452, status: 'In Progress' },
          { title: 'Streetlight not working', lat: -1.3000, lng: 36.8000, status: 'Pending' }
        ];
        examples.forEach(r => {
          const marker = L.marker([r.lat, r.lng]).addTo(markersLayer);
          marker.bindPopup(`<strong>${r.title}</strong><br>Status: ${r.status}`);
        });
      }
    }

    loadReports();
  </script>

</body>
</html>
